workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  image: node:22.20.0-alpine3.22
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

stages:
  - quality
  - security

before_script:
  - npm ci --cache .npm --prefer-offline

lint:
  stage: quality
  script:
    - npm run lint

tests:
  stage: quality
  script:
    - npm run test:coverage
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/

sonarcloud:
  stage: security
  image:
    name: sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0
    entrypoint: [""]
  needs:
    - job: tests
      artifacts: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-${CI_PROJECT_ID}"
    paths:
      - .sonar/cache
  before_script: []
  script:
    - sonar-scanner -Dsonar.token="$SONAR_TOKEN"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

dependency_audit:
  stage: security
  script:
    - npm audit --audit-level=high
  allow_failure: false

secret_detection:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.29.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  before_script: []
  script:
    - >-
      gitleaks git
      --redact
      --verbose
      --exit-code 1
      --report-format json
      --report-path gitleaks-report.json
      .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gitleaks-report.json
