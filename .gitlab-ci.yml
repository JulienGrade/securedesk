workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  image: node:22.20.0-alpine3.22
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

stages:
  - quality

before_script:
  - npm ci --cache .npm --prefer-offline

lint:
  stage: quality
  script:
    - npm run lint

tests:
  stage: quality
  script:
    - npm run test:coverage
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/
